# Reverse proxy przed aplikacją w Dockerze (docker-compose.yml, usługa „nginx”).
# Aplikacja sama obsługuje prefiks /sprzet (APP_BASE_PATH) — ścieżki idą bez przepisywania.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Wbudowany DNS Dockera; adres kontenera aplikacji ustalany przy każdym żądaniu (nie raz przy
    # starcie nginx) — po aktualizacji aplikacja dostaje nowy kontener, często z innym IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $aplikacja http://sprzet-it:4000;

    # Przekierowania względne — nginx w kontenerze słucha na 80, a z zewnątrz port bywa inny
    # (HTTP_PORT), więc pełny adres zbudowany przez nginx zgubiłby go.
    absolute_redirect off;

    # Sam adres serwera → aplikacja.
    location = / {
        return 302 /sprzet/;
    }

    location /sprzet/ {
        # Załączniki faktur i instalatory z katalogu onboardingu (limit aplikacji: 1 GB);
        # duże pliki idą prosto do aplikacji, bez buforowania na dysku nginx.
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        proxy_pass $aplikacja;
        proxy_http_version 1.1;
        # $http_host zawiera port (np. 192.168.1.50:8080) — skrypty onboardingu i odczytu
        # dostają z niego adres serwera, więc port nie może zginąć.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Aplikacja nie kompresuje odpowiedzi — frontend (JS ~600 KB) po gzip to ~200 KB.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
