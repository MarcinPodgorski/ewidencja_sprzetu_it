<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ewidencja sprzętu IT</title>
    <script>
      // Ustawiane synchronicznie, przed pierwszym malowaniem strony, żeby uniknąć
      // błysku złego motywu (FOUC) przy starcie w trybie ciemnym. Logika zapisu
      // wyboru użytkownika żyje w src/theme/ThemeContext.tsx — to tylko odczyt.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
